name: FinCore Security Scans

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: JS & Python Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit npm/pnpm dependencies (fail on critical/high)
        run: pnpm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit -r services/risk/requirements.txt

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks CLI (OSS)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact

  container-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: risk
            dockerfile: infra/docker/risk.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image for scan
        run: docker build -f ${{ matrix.dockerfile }} -t fincore-${{ matrix.name }}:scan .
      - name: Trivy vulnerability scan (${{ matrix.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fincore-${{ matrix.name }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
