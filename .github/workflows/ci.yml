name: FinCore CI Pipeline

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck, Build & Web Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @fincore/contracts run build
      - name: Lint & Typecheck API
        run: |
          pnpm --filter @fincore/api run lint
          pnpm --filter @fincore/api run typecheck
      - name: Build API
        run: pnpm --filter @fincore/api run build
      - name: Lint, Typecheck & Test Web
        run: |
          pnpm --filter @fincore/web run lint
          pnpm --filter @fincore/web run typecheck
          pnpm --filter @fincore/web run test
      - name: Build Web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: pnpm --filter @fincore/web run build

  api-integration-tests:
    name: API Unit, Integration, Concurrency & Security Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fincore
          POSTGRES_PASSWORD: fincore_dev
          POSTGRES_DB: fincore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fincore/contracts run build
      - name: Run Vitest suite with PostgreSQL 16
        env:
          TEST_DATABASE_URL: postgresql://fincore:fincore_dev@localhost:5432/fincore_test
          REDIS_URL: redis://localhost:6379
        run: pnpm --filter @fincore/api run test:coverage

  python-risk-tests:
    name: FastAPI Risk & Decimal Calculations (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/risk/requirements.txt pytest-cov
      - name: Run pytest with coverage
        working-directory: services/risk
        run: python -m pytest -v --cov=app --cov-report=term-missing

  docker-build-check:
    name: Validate Compose & Build Container Images
    runs-on: ubuntu-latest
    needs: [lint-typecheck-build, api-integration-tests, python-risk-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose manifest
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          rm -f .env
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: fincore-api:ci
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          push: false
          tags: fincore-web:ci
      - name: Build Risk image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/risk.Dockerfile
          push: false
          tags: fincore-risk:ci
