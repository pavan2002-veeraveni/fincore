[project]
name = "fincore-risk-analytics"
version = "0.1.0"
description = "FinCore Risk Analytics Service — SIMULATED risk scoring for decision support only"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
